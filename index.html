<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f59e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="برق‌یار">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>برق‌یار | فروشگاه تجهیزات برق ساختمان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--mu:#6b7686;--ac:#f59e0b;--ac2:#b45309;--bd:#e4e7ec;--wa:#25d366;--tg:#229ed9}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222c;--tx:#eef1f5;--mu:#98a3b3;--ac:#fbbf24;--ac2:#fcd34d;--bd:#2b3441}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;padding-bottom:100px}
header{position:sticky;top:0;background:var(--bg);padding:14px 14px 8px;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:800}h1 span{color:var(--ac)}
input,textarea,select{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px}
.chip{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#1b2330;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.ic{font-size:38px;text-align:center;background:var(--bg);border-radius:12px;padding:10px}
.p b{font-size:14px}.p small,.mu{color:var(--mu);font-size:12px}
.pr{font-weight:800;color:var(--ac2);margin-top:auto}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:10px;background:var(--ac);color:#1b2330;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.btn.wa{background:var(--wa);color:#fff}.btn.tg{background:var(--tg);color:#fff}.btn.gh{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.bar{position:fixed;inset:auto 12px 12px 12px;background:var(--tx);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;z-index:6}
.bar.h{display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end}
.sheet.o{display:flex}
.in{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
@media(min-width:760px){.in{max-width:720px;margin:0 auto}}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.tot{font-weight:800;font-size:17px;padding:12px 0}
.ar{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.ar .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ar input{margin:0}
.link{background:none;border:0;color:var(--ac2);font:inherit;cursor:pointer;padding:6px}
.tabs{display:flex;gap:8px;margin:8px 0}.err{color:#dc2626;font-size:13px}.okc{color:#16a34a;font-size:13px}
.st{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bd)}
</style>
</head>
<body>
<header>
<div class="top"><h1>⚡ برق‌<span>یار</span></h1><div><button class="link" onclick="openContact()">تماس با ما</button><button class="link" onclick="openAdmin()">⚙️ مدیر</button></div></div>
<input id="q" placeholder="جستجوی کالا (مثلاً سیم، کلید، لامپ…)" oninput="draw()">
</header>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"><p class="mu" style="grid-column:1/-1;text-align:center">در حال بارگذاری…</p></div>
<div class="bar h" id="bar" onclick="openCart()"><span id="bn"></span><b id="bt"></b></div>
<div class="sheet" id="sh" onclick="if(event.target===this)closeSh()"><div class="in" id="in"></div></div>
<script>
var SB='https://zgswoheckqasqoclhodg.supabase.co',KEY='sb_publishable_Gs5TQ0bdmhNvboT6_1gU3Q_mzmnv2Ny';
var WA='989366428816',TG='makekzir',MAIL='makealmatykz@gmail.com';
var P=[],cat='همه',cart={},saved=false,mode='',token=null,tab='orders',O=[];
function $(i){return document.getElementById(i)}
function f(n){return Number(n||0).toLocaleString('fa-IR')}
function pr(n){return f(n)+' ریال'}
function en(n){return Number(n).toLocaleString('en-US')+' ریال'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function val(i){var e=$(i);return e?e.value:''}
function api(path,o){o=o||{};var h={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json'};if(o.prefer)h.Prefer=o.prefer;
 return fetch(SB+'/rest/v1/'+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined,keepalive:!!o.keep}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||r.status)});return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null})})}
function load(){api('shop_products?select=*&order=id').then(function(d){P=d||[];draw()}).catch(function(){$('grid').innerHTML='<p class="err" style="grid-column:1/-1;text-align:center">بارگذاری کالاها ناموفق بود. صفحه را دوباره باز کنید.</p>'})}
function cats(){return ['همه'].concat(P.map(function(x){return x.category}).filter(function(v,i,a){return v&&a.indexOf(v)===i}))}
function draw(){
 var cs=cats();
 $('chips').innerHTML=cs.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'">'+esc(c)+'</button>'}).join('');
 Array.prototype.forEach.call($('chips').children,function(b,i){b.onclick=function(){cat=cs[i];draw()}});
 var q=$('q').value.trim();
 var l=P.filter(function(x){return (cat==='همه'||x.category===cat)&&(!q||x.name.indexOf(q)>-1||x.category.indexOf(q)>-1)});
 $('grid').innerHTML=l.length?l.map(function(x){
  var n=cart[x.id]||0,b;
  if(!x.in_stock)b='<button class="btn gh" disabled>ناموجود</button>';
  else if(n)b='<div class="qty"><button onclick="chg('+x.id+',1)">+</button><b>'+f(n)+'</b><button onclick="chg('+x.id+',-1)">−</button></div>';
  else b='<button class="btn" onclick="chg('+x.id+',1)">افزودن به سبد</button>';
  return '<div class="p"><div class="ic">'+esc(x.emoji)+'</div><b>'+esc(x.name)+'</b><small>'+esc(x.category)+' · '+esc(x.unit)+'</small><div class="pr">'+pr(x.price)+'</div>'+b+'</div>'
 }).join(''):'<p class="mu" style="grid-column:1/-1;text-align:center">کالایی پیدا نشد</p>';
 var L=lines();$('bar').className='bar'+(L.n?'':' h');$('bn').textContent='مشاهده سبد ('+f(L.n)+' کالا)';$('bt').textContent=pr(L.t);
}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];saved=false;draw();if(mode==='cart')cartView()}
function show(m){mode=m;$('sh').className='sheet o'}
function closeSh(){$('sh').className='sheet';mode=''}
function lines(){var t=0,n=0,a=[];P.forEach(function(x){var q=cart[x.id];if(!q)return;t+=q*x.price;n+=q;a.push({name:x.name,unit:x.unit,qty:q,price:x.price})});return {a:a,t:t,n:n}}
function orderText(){var L=lines();return 'سفارش جدید از برق‌یار\n'+L.a.map(function(i){return '• '+i.name+' × '+i.qty+' ('+i.unit+') = '+en(i.qty*i.price)}).join('\n')+'\nجمع کل: '+en(L.t)+'\nنام: '+val('nm')+'\nتلفن: '+val('ph')+'\nآدرس: '+val('ad')}
function openCart(){show('cart');cartView()}
function cartView(){
 var L=lines(),h='';
 if(!L.n){$('in').innerHTML='<p style="text-align:center">سبد خرید خالی است</p><button class="btn" onclick="closeSh()">بستن</button>';return}
 L.a.forEach(function(i){var x=P.filter(function(p){return p.name===i.name})[0];h+='<div class="row"><div><b>'+esc(i.name)+'</b><br><small class="mu">'+pr(i.price)+' × '+f(i.qty)+'</small></div><div class="qty"><button onclick="chg('+x.id+',1)">+</button><b>'+f(i.qty)+'</b><button onclick="chg('+x.id+',-1)">−</button></div></div>'});
 var nm=val('nm'),ph=val('ph'),ad=val('ad');
 $('in').innerHTML='<h3 style="margin:0 0 6px">سبد خرید</h3>'+h+'<div class="tot">جمع کل: '+pr(L.t)+'</div>'+
 '<input id="nm" placeholder="نام و نام خانوادگی" value="'+esc(nm)+'"><input id="ph" type="tel" placeholder="شماره تماس" value="'+esc(ph)+'"><textarea id="ad" rows="2" placeholder="آدرس تحویل">'+esc(ad)+'</textarea>'+
 '<p id="er" class="err"></p><p class="mu">ثبت و ارسال سفارش از طریق:</p>'+
 '<a class="btn wa" target="_blank" rel="noopener" href="#" onclick="return go(this,\'wa\')">واتس‌اپ</a>'+
 '<a class="btn tg" target="_blank" rel="noopener" href="https://t.me/'+TG+'" onclick="return go(this,\'tg\')">تلگرام (@'+TG+')</a>'+
 '<form method="POST" action="https://formsubmit.co/'+MAIL+'" target="_blank" onsubmit="return go(this,\'mail\')">'+
 '<input type="hidden" name="_subject" value="سفارش جدید برق‌یار"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_template" value="table">'+
 '<input type="hidden" name="name" id="f_n"><input type="hidden" name="phone" id="f_p"><input type="hidden" name="address" id="f_a"><input type="hidden" name="order" id="f_o">'+
 '<button class="btn gh" type="submit">ایمیل</button></form>';
}
function go(el,k){
 if(!val('nm').trim()||!val('ph').trim()||!val('ad').trim()){$('er').textContent='لطفاً نام، شماره تماس و آدرس را کامل کنید.';return false}
 var t=orderText(),L=lines();
 if(!saved){saved=true;api('shop_orders',{method:'POST',prefer:'return=minimal',keep:1,body:{customer_name:val('nm').trim(),phone:val('ph').trim(),address:val('ad').trim(),items:L.a,total:L.t}}).catch(function(){saved=false})}
 if(k==='wa'){el.href='https://wa.me/'+WA+'?text='+encodeURIComponent(t)}
 else if(k==='tg'){try{navigator.clipboard.writeText(t)}catch(e){}$('er').className='okc';$('er').textContent='سفارش ثبت شد. متن سفارش کپی شد؛ در تلگرام Paste و ارسال کنید.'}
 else{$('f_n').value=val('nm');$('f_p').value=val('ph');$('f_a').value=val('ad');$('f_o').value=t}
 return true;
}
function openContact(){show('contact');
 $('in').innerHTML='<h3 style="margin:0 0 6px">تماس با ما</h3><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+WA+'">واتس‌اپ</a><a class="btn tg" target="_blank" rel="noopener" href="https://t.me/'+TG+'">تلگرام (@'+TG+')</a>'+
 '<h4 style="margin:16px 0 6px">ارسال پیام</h4><form method="POST" action="https://formsubmit.co/'+MAIL+'" target="_blank">'+
 '<input type="hidden" name="_subject" value="پیام جدید از برق‌یار"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_template" value="table">'+
 '<input name="name" placeholder="نام" required><input name="phone" type="tel" placeholder="شماره تماس" required><textarea name="message" rows="3" placeholder="پیام شما" required></textarea><button class="btn" type="submit">ارسال پیام</button></form>';
}
/* ---------- مدیر ---------- */
function openAdmin(){show('admin');token?adminView():loginView()}
function loginView(m){$('in').innerHTML='<h3 style="margin:0 0 8px">ورود مدیر</h3><input id="em" type="email" placeholder="ایمیل" dir="ltr"><input id="pw" type="password" placeholder="رمز عبور" dir="ltr"><button class="btn" onclick="login()">ورود</button><p class="err">'+(m||'')+'</p>'}
function login(){
 fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:val('em').trim(),password:val('pw')})})
 .then(function(r){return r.json()}).then(function(d){if(!d.access_token)return loginView('ایمیل یا رمز عبور اشتباه است.');token=d.access_token;adminView()}).catch(function(){loginView('خطا در اتصال.')})
}
function logout(){token=null;closeSh()}
function adminView(){
 $('in').innerHTML='<div class="row"><h3 style="margin:0">⚙️ مدیریت</h3><button class="link" onclick="logout()">خروج</button></div><div class="tabs"><button class="chip'+(tab==='orders'?' on':'')+'" onclick="tab=\'orders\';adminView()">سفارش‌ها</button><button class="chip'+(tab==='products'?' on':'')+'" onclick="tab=\'products\';adminView()">کالاها</button></div><div id="ab"><p class="mu">در حال بارگذاری…</p></div>';
 tab==='orders'?ordersView():productsView();
}
function fail(e){$('ab').innerHTML='<p class="err">دسترسی ندارید یا خطایی رخ داد. با ایمیل مدیر وارد شوید.</p>'}
var ST={new:'جدید',done:'انجام‌شده',cancelled:'لغو'};
function ordersView(){api('shop_orders?select=*&order=created_at.desc&limit=100').then(function(d){O=d||[];
 $('ab').innerHTML=O.length?O.map(function(o,i){return '<div class="ar"><div class="row" style="border:0"><b>'+esc(o.customer_name)+'</b><span class="st">'+ST[o.status]+'</span></div><div class="mu">'+esc(o.phone)+' · '+new Date(o.created_at).toLocaleString('fa-IR')+'</div><div class="mu">'+esc(o.address)+'</div>'+
  o.items.map(function(i){return '<div style="font-size:13px">• '+esc(i.name)+' × '+f(i.qty)+'</div>'}).join('')+'<div class="tot" style="padding:6px 0">'+pr(o.total)+'</div>'+
  '<div class="qty"><button style="width:auto;padding:0 12px" onclick="ost('+i+',\'done\')">انجام شد</button><button style="width:auto;padding:0 12px" onclick="ost('+i+',\'cancelled\')">لغو</button><button style="width:auto;padding:0 12px" onclick="odel('+i+')">حذف</button></div></div>'}).join(''):'<p class="mu">هنوز سفارشی ثبت نشده است.</p>'}).catch(fail)}
function ost(i,s){api('shop_orders?id=eq.'+O[i].id,{method:'PATCH',prefer:'return=minimal',body:{status:s}}).then(ordersView).catch(fail)}
function odel(i){if(confirm('این سفارش حذف شود؟'))api('shop_orders?id=eq.'+O[i].id,{method:'DELETE'}).then(ordersView).catch(fail)}
function productsView(){var h='<button class="btn gh" onclick="padd()">＋ کالای جدید</button>';
 P.forEach(function(x,i){h+='<div class="ar"><div class="g"><input id="pn'+i+'" value="'+esc(x.name)+'" placeholder="نام"><input id="pc'+i+'" value="'+esc(x.category)+'" placeholder="دسته"><input id="pp'+i+'" type="number" value="'+x.price+'" placeholder="قیمت (ریال)"><input id="pu'+i+'" value="'+esc(x.unit)+'" placeholder="واحد"><input id="pe'+i+'" value="'+esc(x.emoji)+'" placeholder="ایموجی"><select id="ps'+i+'"><option value="1"'+(x.in_stock?' selected':'')+'>موجود</option><option value="0"'+(x.in_stock?'':' selected')+'>ناموجود</option></select></div>'+
  '<div class="qty" style="margin-top:8px"><button style="width:auto;padding:0 12px" onclick="psave('+i+')">ذخیره</button><button style="width:auto;padding:0 12px" onclick="pdel('+i+')">حذف</button></div></div>'});
 $('ab').innerHTML=h}
function psave(i){var b={name:val('pn'+i).trim(),category:val('pc'+i).trim(),price:Number(val('pp'+i))||0,unit:val('pu'+i).trim()||'عدد',emoji:val('pe'+i)||'🔌',in_stock:val('ps'+i)==='1'};
 if(!b.name||!b.category)return alert('نام و دسته را وارد کنید.');
 api('shop_products?id=eq.'+P[i].id,{method:'PATCH',prefer:'return=minimal',body:b}).then(function(){Object.assign(P[i],b);draw();alert('ذخیره شد')}).catch(function(){alert('ذخیره نشد')})}
function pdel(i){if(confirm('این کالا حذف شود؟'))api('shop_products?id=eq.'+P[i].id,{method:'DELETE'}).then(function(){P.splice(i,1);draw();productsView()}).catch(function(){alert('حذف نشد')})}
function padd(){api('shop_products',{method:'POST',prefer:'return=representation',body:{name:'کالای جدید',category:'متفرقه',unit:'عدد',price:0,emoji:'🔌',in_stock:false}}).then(function(d){P.unshift(d[0]);draw();productsView()}).catch(function(){alert('افزودن نشد')})}
load();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
